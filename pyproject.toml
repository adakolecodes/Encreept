[project]
name = "encreept"
version = "0.1.0"
description = "Turn PDF, Word and PowerPoint files into watermarked, image-only, permission-locked PDFs."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "lxml>=6.1.3",
    "pikepdf>=10.17.0",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]
